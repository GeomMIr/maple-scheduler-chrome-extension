<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maple Scheduler 설정</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="card">
        <p class="eyebrow">MAPLE SCHEDULER</p>
        <h1>스케줄러 설정</h1>
        <p id="settings-description" class="description">월드와 캐릭터를 선택해 스케줄러 관리 대상을 설정하세요.</p>
        <nav class="settings-tabs" aria-label="설정 메뉴">
          <button class="settings-tab active" type="button" data-panel="character-settings">캐릭터</button>
          <button class="settings-tab" type="button" data-panel="account-manager">API 설정</button>
        </nav>
        <section id="character-settings" class="character-settings" hidden>
          <div class="section-heading">
            <div><h2>관리할 캐릭터</h2><p class="hint">월드를 열고 앞으로 스케줄러를 확인할 캐릭터만 체크하세요.</p></div>
            <button id="reload-characters" class="secondary" type="button">목록 새로고침</button>
          </div>
          <div id="world-list" class="world-list"></div>
          <section id="character-picker" class="character-picker" hidden>
            <h3 id="selected-world-title">캐릭터 목록</h3>
            <p class="hint">카드를 클릭해 스케줄러 관리 대상으로 추가하거나 해제하세요.</p>
            <div id="character-list" class="character-list"></div>
          </section>
          <div class="button-row">
            <button id="save-characters" class="primary" type="button">선택 저장</button>
          </div>
        </section>
        <section id="account-manager" class="account-manager">
          <div class="section-heading"><div><h2>API 관리</h2><p class="hint">API 키별로 계정과 관리 캐릭터를 따로 저장합니다.</p></div></div>
          <div id="account-list" class="account-list"></div>
          <form id="api-key-form" class="api-key-form">
            <h3>API 계정 추가</h3>
            <label class="sub-label" for="account-label">계정 이름 (선택)</label>
            <input id="account-label" name="account-label" type="text" maxlength="32" placeholder="예: 본계정, 부계정" autocomplete="off" />
            <label for="api-key">넥슨 Open API 키</label>
            <div class="key-row">
              <input id="api-key" name="api-key" type="password" autocomplete="off" required />
              <button id="toggle-key" type="button" class="secondary">보기</button>
            </div>
            <p class="hint">키는 <a href="https://openapi.nexon.com/ko/" target="_blank" rel="noopener noreferrer">넥슨 Open API 포털</a>에서 발급받을 수 있습니다.</p>
            <p class="hint">새 키는 별도 계정으로 추가됩니다. 이미 등록된 키를 입력하면 해당 계정으로 전환합니다.</p>
            <button type="submit" class="primary">계정 추가 및 캐릭터 불러오기</button>
            <p id="status" class="status" role="status" aria-live="polite"></p>
          </form>
        </section>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
